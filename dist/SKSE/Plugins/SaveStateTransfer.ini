; SaveStateTransfer configuration. Keys are DirectInput scan codes (decimal):
;   F5=63 F6=64 F7=65 F8=66 F9=67 F10=68 F11=87 F12=88  LShift=42 LCtrl=29 LAlt=56  (0 = none)
[Hotkeys]
iExportKey=65
iImportKey=66
iDryRunKey=67
iModifierKey=42
; Require the hotkey to be pressed twice within iDoublePressWindowMs to fire (guards against noise in VR).
bRequireDoublePress=1
iDoublePressWindowMs=2000

[General]
; Poll <My Games>/Skyrim VR/SaveStateTransfer/commands/ for export.cmd / import.cmd / dryrun.cmd.
bEnableTriggerFiles=1
iTriggerPollMs=1000

[Import]
; Frames to yield between quest stage applications so Papyrus fragments get time to run.
iFramesBetweenStages=3

[Debug]
; Log every import step (the last line before a crash names the offending quest/item).
bLogImportSteps=1
