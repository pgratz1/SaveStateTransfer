name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure
        run: cmake --preset windows-msvc-release
      - name: Build
        run: cmake --build --preset windows-msvc-release --parallel
      - name: Upload staged mod folder
        uses: actions/upload-artifact@v4
        with:
          name: SaveStateTransfer-${{ github.sha }}
          path: build/windows-msvc-release/stage
          if-no-files-found: error
